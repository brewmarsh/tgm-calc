{% extends "base.html" %}

{% block title %}Investment Cost Calculator{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">
            <h1>Investment Cost Calculator</h1>
        </div>
        <div class="card-body">
            <form action="{{ url_for('main.investment_cost_calculator') }}" method="POST">
                <div class="mb-3">
                    <label for="building_name" class="form-label">Building Name</label>
                    <select class="form-control" id="building_name" name="building_name">
                        <option value="Faction Club">Faction Club</option>
                        <option value="Hostage Cell">Hostage Cell</option>
                        <option value="Interrogation Room">Interrogation Room</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="current_level" class="form-label">Current Level</label>
                    <input type="number" class="form-control" id="current_level" name="current_level" value="1">
                </div>
                <div class="mb-3">
                    <label for="target_level" class="form-label">Target Level</label>
                    <input type="number" class="form-control" id="target_level" name="target_level" value="25">
                </div>
                <button type="submit" class="btn btn-primary">Calculate</button>
            </form>
            {% if result %}
                <hr>
                <h2>Results</h2>
                <p>Total Cost: {{ result.total_cost }}</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
